[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashforge"
version = "0.1.0"
description = "FlashAttention from first principles: prefill, split-KV decode, adversarial correctness, and roofline analysis"
requires-python = ">=3.10"
dependencies = ["torch>=2.3"]

[tool.setuptools]
packages = ["flashforge"]
